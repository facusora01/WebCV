<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1714">
    <title>Facundo Sorasio | Software Developer</title>
    <meta name="description"
        content="Facundo Sorasio, Computer Engineering student at UBA. Real-time systems, bots, self-hosted infrastructure and web apps. Walk into my room and look around.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://facundosorasio.com/">
    <meta property="og:title" content="Facundo Sorasio | Software Developer">
    <meta property="og:description" content="Walk into my room: projects, experience and contact in an interactive 3D space.">
    <meta property="og:image" content="https://facundosorasio.com/images/og-room.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Facundo's room: two desks under the window, a 3D printer, a TV on the wall and a red nightstand">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/png" href="images/icons/web/webIcon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>

<body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="topbar">
        <a class="brand" href="./" aria-label="Facundo Sorasio">
            <span class="brand-moon" aria-hidden="true"></span>
            <span class="brand-name">facundo sorasio</span>
        </a>
        <nav class="actions">
            <button id="btn-sound" class="pill" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span data-t="sound">Sound</span></button>
            <div class="pill lang-switch" role="group" aria-label="Language / Idioma">
                <button data-lang="es" aria-pressed="false">ES</button>
                <button data-lang="en" aria-pressed="false">EN</button>
            </div>
            <button id="btn-cv" class="pill pill-solid" data-t="classic">Classic CV</button>
        </nav>
    </header>

    <div id="markers"></div>
    <button id="handle-btn" class="marker handle-marker hidden" aria-label="Open the door"><i></i></button>
    <input id="term-input" class="sr-only" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal">
    <p id="hint" class="hint"></p>

    <div id="cv" class="cv" hidden>
        <div class="cv-inner">
            <button id="cv-close" class="pill" data-t="room">Back to the room</button>
            <p id="cv-note" class="cv-note"></p>
            <div id="cv-body"></div>
        </div>
    </div>

    <noscript>
        <div class="cv" style="display:block">
            <div class="cv-inner">
                <h1>Facundo Sorasio</h1>
                <p>Computer Engineering student at UBA. Real-time systems, bots, self-hosted infrastructure and web apps.</p>
                <p><a href="mailto:facusorasio@hotmail.com">facusorasio@hotmail.com</a> · <a href="https://github.com/facusora01">github.com/facusora01</a></p>
            </div>
        </div>
    </noscript>
</body>

</html>
